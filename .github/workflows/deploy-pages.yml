name: Deploy dashboard to GitHub Pages

# Publishes the static dashboard (index.html) to GitHub Pages on every push to main.
# index.html is self-contained (no build step required), so we publish a small
# folder containing just the page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site folder
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          # 404 fallback so deep links resolve to the dashboard
          cp index.html _site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
