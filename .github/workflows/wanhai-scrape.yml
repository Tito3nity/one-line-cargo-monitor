name: Wan Hai Daily Cargo Tracker

on:
  schedule:
    # "Always fresh" cadence: every 3 hours, offset to :10 so it never collides
    # with the ONE Line tracker's top-of-hour run. 8 runs/day keeps the BL
    # current without hammering Wan Hai or burning Actions minutes.
    # (00:10, 03:10, 06:10, 09:10, 12:10, 15:10, 18:10, 21:10 UTC)
    - cron: '10 */3 * * *'
  # workflow_dispatch lets the dashboard's "Refresh Wan Hai" button trigger an
  # on-demand scrape via the GitHub REST API (see index.html dispatchWanhai()).
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        working-directory: ./scraper
        run: npm install

      - name: Install Chromium
        run: npx puppeteer browsers install chrome

      - name: Run Wan Hai cargo tracker
        working-directory: ./scraper
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: node wanhai-scraper.js
